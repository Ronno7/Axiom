<text x="1192" y="1370" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#6FC3DF">CONTROLLED DERIVATION</text>
<text x="72" y="1410" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">Most surfaces stay dark and substantial.</text>
<text x="72" y="1444" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">Light describes selected seams and openings.</text>
<text x="72" y="1478" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">Orange is system / Program energy.</text>
<text x="72" y="1512" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">Threats also need a clear shape or telegraph.</text>
<text x="72" y="1546" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">Gold stays rare: bosses and authority.</text>
<text x="72" y="1580" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">The menu band uses restrained Orange.</text>
<text x="632" y="1410" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#8198A6">Muted</text>
<text x="830" y="1410" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">5.04:1 on Panel</text>
<text x="632" y="1444" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">Text</text>
<text x="830" y="1444" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">8.88:1 on Panel</text>
<text x="632" y="1478" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#6FC3DF">Cyan</text>
<text x="830" y="1478" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">7.62:1 on Panel</text>
<text x="632" y="1512" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#DF740C">Orange</text>
<text x="830" y="1512" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">4.80:1 on Panel</text>
<text x="632" y="1546" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#FFF2D9">Hot</text>
<text x="830" y="1546" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">13.70:1 on Panel</text>
<text x="632" y="1580" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">Small critical text uses Hot, not Ember.</text>
<text x="1192" y="1410" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">Alpha, shade and emission are separate.</text>
<text x="1192" y="1444" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">Convert sRGB once at the shader boundary.</text>
<text x="1192" y="1478" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">Scale RGB for HDR; keep alpha independent.</text>
<text x="1192" y="1512" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">Use explicit ramps; reserve Gold identity.</text>
<text x="1192" y="1546" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">No arbitrary hue shifts or new accent colors.</text>
<text x="1192" y="1580" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#B7C9D1">Lit pixels remain continuous, not quantized.</text>
